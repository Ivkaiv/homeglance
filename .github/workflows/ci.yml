name: CI

# Базовая проверка для каждого PR и push в main: типы и production-build.
# Тесты добавим, когда они появятся.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1'

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
